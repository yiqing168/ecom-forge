name: ecom-forge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecom_forge
      POSTGRES_PASSWORD: ecom_forge_dev
      POSTGRES_USER: ecom_forge
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecom_forge -d ecom_forge']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
