name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ecom_forge:ecom_forge_dev@localhost:5432/ecom_forge_test
      TEST_DATABASE_URL: postgresql://ecom_forge:ecom_forge_dev@localhost:5432/ecom_forge_test
      S14_TEST_DATABASE_URL: postgresql://ecom_forge:ecom_forge_dev@localhost:5432/ecom_forge_test_s14_gate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecom_forge
          POSTGRES_PASSWORD: ecom_forge_dev
          POSTGRES_DB: ecom_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom_forge -d ecom_forge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/setup-local.test.mjs
      - run: PGPASSWORD=ecom_forge_dev createdb -h localhost -U ecom_forge ecom_forge_test_s14_gate
      - run: pnpm db:migrate
      - run: DATABASE_URL=$S14_TEST_DATABASE_URL pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:quality-gates
      - run: pnpm build
